name: 株価テクニカル情報の自動収集

on:
  schedule:
    # 平日 9:00〜16:00(JST) に15分おき ＝ UTC 0:00〜7:00
    - cron: '*/15 0-7 * * 1-5'
    # 前場前の準備（JST 8:30）と大引け後の確定値（JST 16:30）
    - cron: '30 23 * * 0-4'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: データ収集・テクニカル分析
        run: python toushi/collect.py

      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toushi/data/market.json
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "market: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') 時点のテクニカル情報"
            git push
          fi
